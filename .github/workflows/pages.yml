# Publica a pasta public/dimensionador no GitHub Pages (Dimensionador de bomba de calor).
# Roda a cada push na main que toque nessa pasta, ou manualmente em Actions > "Dimensionador no GitHub Pages".
name: Dimensionador no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'public/dimensionador/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public/dimensionador
      - id: deploy
        uses: actions/deploy-pages@v4

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data:; script-src 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dimensionador de bomba de calor · GN Representações</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <header class="top">
    <div class="top-l">
      <img src="assets/logo-gn.png" alt="GN Representações" class="logo-gn" />
      <div class="top-title"><strong>Dimensionador de bomba de calor</strong><span>Piscinas · indicação preliminar</span></div>
    </div>
    <div class="top-r">
      <img src="assets/logo-syllent.png" alt="Syllent" class="logo-syllent" />
    </div>
  </header>

  <main class="layout">
    <!-- ===== Formulário ===== -->
    <section class="form">
      <div class="block">
        <h2><span>1</span>Cliente</h2>
        <div class="g2">
          <label>Nome do cliente<input id="cliente" placeholder="Nome ou empresa" /></label>
          <label>Cidade<input id="cidade" placeholder="Cidade" /></label>
        </div>
        <div class="g3">
          <label>UF do projeto<select id="uf"></select></label>
          <label>Telefone <small>opcional</small><input id="fone" placeholder="(00) 00000-0000" /></label>
          <label>Nº do orçamento<input id="numero" value="2026-0001" /></label>
        </div>
      </div>

      <div class="block">
        <h2><span>2</span>Piscina</h2>
        <div class="seg" data-campo="modoVolume"><button type="button" data-v="medidas" class="on">Calcular pelas medidas</button><button type="button" data-v="litros">Já sei o volume</button></div>
        <div id="modoMedidas">
          <div class="g3">
            <label>Comprimento<div class="f"><input id="pComp" type="number" step="0.1" value="8" /><span>m</span></div></label>
            <label>Largura<div class="f"><input id="pLarg" type="number" step="0.1" value="4" /><span>m</span></div></label>
            <label>Profundidade média<div class="f"><input id="pProf" type="number" step="0.1" value="1.4" /><span>m</span></div></label>
          </div>
          <label class="chk"><input type="checkbox" id="temPrainha" /><span>Prainha / deck molhado</span></label>
          <div id="prainhaBox" class="g3" hidden>
            <label>Comprimento<div class="f"><input id="prComp" type="number" step="0.1" /><span>m</span></div></label>
            <label>Largura<div class="f"><input id="prLarg" type="number" step="0.1" /><span>m</span></div></label>
            <label>Profundidade<div class="f"><input id="prProf" type="number" step="0.05" value="0.3" /><span>m</span></div></label>
          </div>
        </div>
        <div id="modoLitros" hidden>
          <label>Volume total<div class="f"><input id="litros" type="number" step="100" value="50000" /><span>litros</span></div></label>
        </div>
        <p class="hint" id="volPreview"></p>
      </div>

      <div class="block">
        <h2><span>3</span>Condições de uso</h2>
        <div class="g3">
          <label>Temperatura inicial<div class="f"><input id="tIni" type="number" value="20" /><span>°C</span></div></label>
          <label>Temperatura desejada<div class="f"><input id="tDes" type="number" value="32" /><span>°C</span></div></label>
          <label>Tarifa de energia<div class="f"><input id="tarifa" type="number" step="0.01" value="1.00" /><span>R$/kWh</span></div></label>
        </div>
        <div class="g3">
          <label>Capa térmica<select id="capa"><option value="sim">Usa capa</option><option value="nao">Sem capa</option></select></label>
          <label>Tipo de piscina<select id="tipo"><option value="aberta">Aberta</option><option value="fechada">Fechada</option></select></label>
          <label>Exposição ao vento<select id="vento"><option value="fraco">Fraco</option><option value="moderado" selected>Moderado</option><option value="forte">Forte</option></select></label>
        </div>
        <div class="row">
          <label class="chk"><input type="checkbox" id="temCascata" /><span>Cascata</span></label>
          <div class="f sm" id="cascataBox" hidden><input id="cascataCm" type="number" step="10" placeholder="comprimento" /><span>cm</span></div>
          <label class="chk"><input type="checkbox" id="temInfinita" /><span>Borda infinita</span></label>
          <div class="f sm" id="infinitaBox" hidden><input id="inBorda" type="number" step="0.5" placeholder="borda" /><span>m</span></div>
        </div>
        <details><summary>Hidráulica</summary>
          <div class="g2">
            <label>Horas de recirculação<select id="hRec"><option>6</option><option selected>8</option><option>10</option><option>12</option></select></label>
            <label>Altura manométrica<select id="mca"><option>6</option><option selected>8</option><option>10</option><option>12</option></select></label>
          </div>
        </details>
      </div>

      <div class="block">
        <h2><span>4</span>Equipamento</h2>
        <div id="opcoes" class="opts"></div>
        <p class="hint">A primeira opção é a seleção automática. Clique em outra linha para usar no PDF.</p>
      </div>
    </section>

    <!-- ===== Prévia do PDF ===== -->
    <section class="preview">
      <div class="preview-bar">
        <span>Prévia do PDF · A4 · 1 página</span>
        <span id="status" class="status"></span>
      </div>
      <div class="page" id="page"></div>
      <div class="actions">
        <button class="btn primary" id="btnPdf">Gerar PDF</button>
        <button class="btn" id="btnAbrirPdf" hidden>Abrir PDF</button>
        <button class="btn" id="btnPasta">Abrir pasta</button>
        <button class="btn" id="btnLimpar">Limpar</button>
        <span class="path" id="pasta">Documentos\Dimensionamentos</span>
      </div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="calc.js"></script>
  <script src="app.js"></script>
</body>
</html>
